name: Y Converter CI
on:
  push:
    branches: [y-converter-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Extract source
        run: |
          rm -rf ybuild
          mkdir ybuild
          unzip -q y-converter-source.zip -d ybuild
          test -f ybuild/Y-Converter/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' ybuild/Y-Converter/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' ybuild/Y-Converter/app/build.gradle.kts
          grep -E 'compileSdk|targetSdk' ybuild/Y-Converter/app/build.gradle.kts
      - name: Unit tests
        working-directory: ybuild/Y-Converter
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Lint
        working-directory: ybuild/Y-Converter
        run: gradle lintDebug --stacktrace --no-daemon
      - name: Build APK
        working-directory: ybuild/Y-Converter
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          APK=ybuild/Y-Converter/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Y-Converter-final-apk
          path: ybuild/Y-Converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
