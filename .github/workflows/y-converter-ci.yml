name: Y Converter CI
on:
  push:
    branches: [y-converter-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Extract source
        run: |
          rm -rf ybuild
          mkdir ybuild
          unzip -q y-converter-source.zip -d ybuild
          test -f ybuild/Y-Converter/settings.gradle.kts
      - name: Unit tests
        working-directory: ybuild/Y-Converter
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Lint
        working-directory: ybuild/Y-Converter
        run: gradle lintDebug --stacktrace --no-daemon
      - name: Build APK
        working-directory: ybuild/Y-Converter
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: APK metadata
        run: |
          ls -lh ybuild/Y-Converter/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ybuild/Y-Converter/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Y-Converter-final-apk
          path: ybuild/Y-Converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
