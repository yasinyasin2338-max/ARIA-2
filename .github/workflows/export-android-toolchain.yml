name: Export Android Toolchain

on:
  push:
    branches: [ "nova-avatar-v1" ]
    paths:
      - 'toolchain-trigger.txt'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare stable Android 35 SDK bundle
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PLATFORM="android-35"
          test -f "$SDK/platforms/$PLATFORM/android.jar"
          if [ -d "$SDK/build-tools/35.0.1" ]; then
            BT="35.0.1"
          elif [ -d "$SDK/build-tools/35.0.0" ]; then
            BT="35.0.0"
          else
            BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep '^35\.' | sort -V | tail -1)
          fi
          test -n "$BT"
          mkdir -p android-toolchain/build-tools android-toolchain/platforms
          cp -a "$SDK/build-tools/$BT" "android-toolchain/build-tools/$BT"
          mkdir -p "android-toolchain/platforms/$PLATFORM"
          cp "$SDK/platforms/$PLATFORM/android.jar" "android-toolchain/platforms/$PLATFORM/android.jar"
          printf 'build_tools=%s\nplatform=%s\n' "$BT" "$PLATFORM" > android-toolchain/versions.txt
          tar -C android-toolchain -czf android-toolchain.tgz .
          sha256sum android-toolchain.tgz > android-toolchain.tgz.sha256
          du -h android-toolchain.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-stable-35
          path: |
            android-toolchain.tgz
            android-toolchain.tgz.sha256
          compression-level: 0
