name: Build and verify Orbis AI v2
on:
  push:
    branches: [ "orbis-final-v2" ]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and package
        run: gradle --no-daemon :app:assembleDebug

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Install emulator image
        run: |
          yes | sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n orbis-ci -k "system-images;android-35;google_apis;x86_64" --force

      - name: Boot emulator
        run: |
          $ANDROID_HOME/emulator/emulator -avd orbis-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82 || true

      - name: Install and launch smoke test
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am force-stop ai.orbis.office
          adb shell am start -W ai.orbis.office/.MainActivity | tee /tmp/am-start.txt
          sleep 8
          adb shell pidof ai.orbis.office | tee /tmp/pid.txt
          test -s /tmp/pid.txt
          adb shell uiautomator dump /sdcard/orbis.xml || true
          adb pull /sdcard/orbis.xml /tmp/orbis.xml || true
          adb logcat -d > /tmp/logcat.txt
          if grep -E "FATAL EXCEPTION|Process: ai\.orbis\.office.*has died" /tmp/logcat.txt; then
            echo "Runtime crash detected"
            exit 1
          fi
          grep -q "Orbis AI" /tmp/orbis.xml || (echo "Orbis UI marker not found" && cat /tmp/orbis.xml && exit 1)

      - name: Package diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp /tmp/am-start.txt diagnostics/ 2>/dev/null || true
          cp /tmp/logcat.txt diagnostics/ 2>/dev/null || true
          cp /tmp/orbis.xml diagnostics/ 2>/dev/null || true
          cp /tmp/emulator.log diagnostics/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrbisAI-v2-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrbisAI-v2-Diagnostics
          path: diagnostics/
