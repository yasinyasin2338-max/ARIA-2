name: Build and verify Orbis AI v2
on:
  push:
    branches: [ "orbis-final-v2" ]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and package
        run: gradle --no-daemon :app:assembleDebug

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install, launch and runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop ai.orbis.office
            adb shell am start -W ai.orbis.office/.MainActivity | tee /tmp/am-start.txt
            sleep 10
            adb shell pidof ai.orbis.office | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell uiautomator dump /sdcard/orbis.xml || true
            adb pull /sdcard/orbis.xml /tmp/orbis.xml || true
            adb logcat -d > /tmp/logcat.txt
            if grep -E "FATAL EXCEPTION|Process: ai\.orbis\.office.*has died" /tmp/logcat.txt; then
              echo "Runtime crash detected"
              exit 1
            fi
            grep -q "Orbis AI" /tmp/orbis.xml || (echo "Orbis UI marker not found" && cat /tmp/orbis.xml && exit 1)

      - name: Package diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp /tmp/am-start.txt diagnostics/ 2>/dev/null || true
          cp /tmp/logcat.txt diagnostics/ 2>/dev/null || true
          cp /tmp/orbis.xml diagnostics/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrbisAI-v2-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrbisAI-v2-Diagnostics
          path: diagnostics/
