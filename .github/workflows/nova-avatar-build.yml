name: Build Nova Avatar APK

# Clean from-scratch Android build track for the Persian text-controlled avatar app.
on:
  push:
    branches: [ "nova-avatar-v1" ]
    paths:
      - 'nova-avatar-source.zip'
      - '.github/workflows/nova-avatar-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack clean source project
        run: |
          rm -rf nova-avatar-build
          mkdir nova-avatar-build
          unzip -q nova-avatar-source.zip -d nova-avatar-build
      - name: Unit tests
        working-directory: nova-avatar-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: nova-avatar-build
        run: gradle assembleDebug --stacktrace
      - name: SHA-256
        working-directory: nova-avatar-build
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: nova-avatar-debug
          path: |
            nova-avatar-build/app/build/outputs/apk/debug/app-debug.apk
            nova-avatar-build/app-debug.sha256
            nova-avatar-source.zip
