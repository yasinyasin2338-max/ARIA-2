name: Build Nova Avatar APK

on:
  push:
    branches: [ "nova-avatar-v1" ]
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct verified 0.3.0 baseline
        run: |
          tr -d '[:space:]' < nova-avatar-v3.b64 > nova-avatar-source.b64
          base64 -d nova-avatar-source.b64 > nova-avatar-source.zip
          echo "f24174224e51dd925ec6edba6ededcdf681aad5d3b6f1b41467a758dfbfd69fb  nova-avatar-source.zip" | sha256sum -c -
          rm -rf nova-avatar-build
          mkdir nova-avatar-build
          unzip -q nova-avatar-source.zip -d nova-avatar-build
      - name: Apply committed 0.3.1 implementation patch
        run: |
          python3 nova-avatar-patches/step-031.py
          grep -q 'برگرد پذیرایی' nova-avatar-build/app/src/main/java/com/arisnova/avatar/engine/CommandParser.java
          grep -q "versionName '0.3.1-dev'" nova-avatar-build/app/build.gradle
          cd nova-avatar-build
          zip -qr ../nova-avatar-0.3.1-dev-source.zip app build.gradle settings.gradle gradle.properties README.md docs tools
          cd ..
          sha256sum nova-avatar-0.3.1-dev-source.zip | tee nova-avatar-0.3.1-dev-source.sha256
      - name: Unit and regression tests
        working-directory: nova-avatar-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: nova-avatar-build
        run: gradle assembleDebug --stacktrace
      - name: Verify APK package, resources and SHA-256
        working-directory: nova-avatar-build
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'resources.arsc'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'res/drawable_nodpi/face_neutral.jpg'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'res/drawable_nodpi/face_smile.jpg'
      - name: Upload APK and exact patched source
        uses: actions/upload-artifact@v4
        with:
          name: nova-avatar-0.3.1-dev
          path: |
            nova-avatar-build/app/build/outputs/apk/debug/app-debug.apk
            nova-avatar-build/app-debug.sha256
            nova-avatar-0.3.1-dev-source.zip
            nova-avatar-0.3.1-dev-source.sha256
