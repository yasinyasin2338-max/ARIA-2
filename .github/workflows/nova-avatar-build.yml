name: Build Nova Avatar APK

on:
  push:
    branches: [ "nova-avatar-v1" ]
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct and verify source archive
        run: |
          cat nova-avatar-v2.b64.* > nova-avatar-source.b64
          base64 -d nova-avatar-source.b64 > nova-avatar-source.zip
          echo "ea415d3857f6ec26c68bd9fb319c6e6fd9b13a48cf2415ac463d1b8398bb9abd  nova-avatar-source.zip" | sha256sum -c -
          rm -rf nova-avatar-build
          mkdir nova-avatar-build
          unzip -q nova-avatar-source.zip -d nova-avatar-build
      - name: Unit tests
        working-directory: nova-avatar-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: nova-avatar-build
        run: gradle assembleDebug --stacktrace
      - name: Verify APK package and SHA-256
        working-directory: nova-avatar-build
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: nova-avatar-0.2.0-dev
          path: |
            nova-avatar-build/app/build/outputs/apk/debug/app-debug.apk
            nova-avatar-build/app-debug.sha256
            nova-avatar-source.zip
